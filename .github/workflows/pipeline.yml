name: Pipeline

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  build-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      skip_if_exists: true

  build-pipelines:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout proc-decam
        uses: actions/checkout@v4

      # `pipetask build` resolves a pipeline's tasks/configs/connections into
      # a graph without running anything - no data or butler repo needed.
      # DRP.yaml references proc_decam's own ApplyDefectsTask, so proc-decam
      # needs to be installed first for that one to resolve.
      #
      # step4a's subset was previously just {getTemplate}, which failed to
      # resolve in isolation with `KeyError: '<UNKNOWN>'`: subtractImages
      # (moved to step4b) was its only in-graph consumer, so pipe_base had
      # nothing to infer that dataset type's storage class from. Keeping
      # subtractImages in step4a (see DRP.yaml) fixes that without needing a
      # butler registry at all.
      #
      # Uses pipelines/viz.sh (the same tool used for local/manual builds)
      # rather than hand-rolled pipetask/dot calls, run via bin/setup.sh so
      # $PROC_DECAM_DIR points at this checkout and viz.sh's output lands
      # under pipelines/ here rather than an install location.
      #
      # Everything runs in one `docker run` (one `pip install .`, one
      # `chmod`) rather than separate steps: `pip install .` leaves build/
      # and src/proc_decam.egg-info/ behind, owned by the container's
      # internal user, and a *second* docker-run step's host-side
      # `chmod -R a+rw .` can't touch those (different uid across the bind
      # mount) - splitting this into two steps failed on exactly that.
      #
      # Only the subsets actually enabled in DRP.yaml's `subsets:` block are
      # listed - step3e-h and step4c are commented out there (real pipeline
      # bugs, see the comments in DRP.yaml), so `pipetask build` would fail
      # on them; left out rather than making this step fail. Uploaded as a
      # workflow artifact instead of committed to the repo - see the docs
      # branch for where an exemplar processed image will eventually live
      # (tracked separately).
      - name: Build pipelines and generate DRP visualizations
        shell: bash
        run: |
          chmod -R a+rw .
          docker run --rm \
            --user root \
            -v $GITHUB_WORKSPACE:/home/lsst/work \
            -w /home/lsst/work \
            ghcr.io/${{ github.repository }}:lsst-w_2024_34 /bin/bash -c "
              set -xe

              # graphviz isn't in the image; only needed here for viz.sh's
              # \`dot\` calls, so install it at runtime rather than growing
              # the image for every other job that pulls it. Needs root, so
              # de-escalate to the image's default lsst user (env preserved
              # - no \`-\`) for everything else.
              yum -y install graphviz

              su lsst -c '
                source /opt/lsst/software/stack/loadLSST.bash
                setup lsst_distrib
                source bin/setup.sh

                set -xe

                pip install .

                bash pipelines/viz.sh pipelines/flat.yaml
                bash pipelines/viz.sh pipelines/bias.yaml
                bash pipelines/viz.sh pipelines/DRP.yaml

                for subset in step0 step1 step1b step2a step2b step2c step2d step2e step2f step3a step3b step3c step3d step4a step4b step4d step4e step4f; do
                  bash pipelines/viz.sh \"pipelines/DRP.yaml#\$subset\"
                done
              '
            "

      - name: Upload DRP pipeline visualizations
        uses: actions/upload-artifact@v4
        with:
          name: drp-pipeline-visualizations
          path: pipelines/**/pipeline.pdf
          if-no-files-found: error
