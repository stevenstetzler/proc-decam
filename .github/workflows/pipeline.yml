name: Pipeline

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      skip_if_exists: true

  build-pipelines:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Explicitly check out the PR's head branch rather than the default
      # merge-commit ref `pull_request` events use: the visualization commit
      # below is pushed straight back to that branch, and pushing a
      # merge-ref checkout would insert a spurious merge commit and diverge
      # from the actual branch history.
      - name: Checkout proc-decam
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      # Whether to publish the visualizations built below: the build itself
      # always runs (it's the CI check that these pipeline files are valid),
      # but attaching/linking rendered images is only useful when one of the
      # files being visualized actually changed in this PR.
      - name: Check for pipeline file changes
        uses: dorny/paths-filter@v3
        id: changed
        with:
          list-files: csv
          filters: |
            pipelines:
              - pipelines/flat.yaml
              - pipelines/bias.yaml
              - pipelines/DRP.yaml

      # `pipetask build` resolves a pipeline's tasks/configs/connections into
      # a graph without running anything - no data or butler repo needed.
      # DRP.yaml references proc_decam's own ApplyDefectsTask, so proc-decam
      # needs to be installed first for that one to resolve.
      #
      # step4a's subset was previously just {getTemplate}, which failed to
      # resolve in isolation with `KeyError: '<UNKNOWN>'`: subtractImages
      # (moved to step4b) was its only in-graph consumer, so pipe_base had
      # nothing to infer that dataset type's storage class from. Keeping
      # subtractImages in step4a (see DRP.yaml) fixes that without needing a
      # butler registry at all.
      #
      # Uses pipelines/viz-all.sh, which discovers and builds every subset of
      # flat.yaml, bias.yaml and DRP.yaml via pipelines/viz.sh (the same tool
      # used for local/manual builds) rather than a whole-file build (which
      # can fail - e.g. flat.yaml as a whole - even when every subset builds
      # fine) or a hardcoded subset list (which goes stale as subsets
      # change). Run via bin/setup.sh so $PROC_DECAM_DIR points at this
      # checkout and viz.sh's output lands under pipelines/ here rather than
      # an install location. See viz-all.sh for the excluded/disabled
      # subsets.
      #
      # Everything runs in one `docker run` (one `pip install .`, one
      # `chmod`) rather than separate steps: `pip install .` leaves build/
      # and src/proc_decam.egg-info/ behind, owned by the container's
      # internal user, and a *second* docker-run step's host-side
      # `chmod -R a+rw .` can't touch those (different uid across the bind
      # mount) - splitting this into two steps failed on exactly that.
      #
      # Renders to pipelines/**/pipeline.{dot,svg,png,jpg,pdf}, which are
      # tracked in git so they're browsable directly on GitHub - committed
      # back to the PR branch below when they change.
      - name: Build pipelines and generate DRP visualizations
        shell: bash
        run: |
          chmod -R a+rw .
          docker run --rm \
            --user root \
            -v $GITHUB_WORKSPACE:/home/lsst/work \
            -w /home/lsst/work \
            ghcr.io/${{ github.repository }}:lsst-w_2024_34 /bin/bash -c "
              set -xe

              # graphviz isn't in the image; only needed here for viz.sh's
              # \`dot\` calls, so install it at runtime rather than growing
              # the image for every other job that pulls it. Needs root, so
              # de-escalate to the image's default lsst user (env preserved
              # - no \`-\`) for everything else.
              yum -y install graphviz

              su lsst -c '
                source /opt/lsst/software/stack/loadLSST.bash
                setup lsst_distrib
                source bin/setup.sh

                set -xe

                pip install .

                bash pipelines/viz-all.sh
              '
            "

      # Pipeline visualizations are tracked in git, so a change only needs a
      # commit back to the PR branch - no artifact upload, no separate
      # comment linking off to one. GitHub always issues a read-only
      # GITHUB_TOKEN for `pull_request` runs triggered by a fork PR into this
      # repo - the `permissions:` block above can't override that - so a
      # push would 403 on any PR from a fork (e.g. one opened against
      # dirac-institute/proc-decam from a personal fork). Skip it there; the
      # build above (which is the actual CI check that these pipeline files
      # are valid) still runs either way.
      - name: Commit updated pipeline visualizations
        if: steps.changed.outputs.pipelines == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipelines/bias pipelines/flat pipelines/DRP
          if git diff --cached --quiet; then
            echo "No visualization changes to commit"
          else
            git commit -m "Update pipeline visualizations [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi
