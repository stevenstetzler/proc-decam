name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      # The workflow itself and what it calls/runs.
      - .github/workflows/test.yml
      - .github/workflows/build-image.yml
      - .github/scripts/lfs_pull_verify.sh
      - Dockerfile
      # Only the modules actually on integration-test's call path (traced
      # import-by-import): cli.py dispatches every subcommand, db.py pulls
      # `popen` from refcats.py, and refcats/fakes/ingest/make_exposures.py
      # are invoked directly. night.py/coadd.py/visualize.py/parsl/** etc.
      # are NOT touched by this job (it stops at `ingest`), so they're
      # deliberately excluded here.
      - pyproject.toml
      - src/proc_decam/cli.py
      - src/proc_decam/db.py
      - src/proc_decam/refcats.py
      - src/proc_decam/fakes.py
      - src/proc_decam/ingest.py
      - tests/make_exposures.py

permissions:
  contents: read
  packages: read

jobs:
  build-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      skip_if_exists: true

  integration-test:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Checkout this repo. Enable Git LFS so LFS-tracked test data are available.
      - name: Checkout proc-decam (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout kbmod_imdiff_recipe
        uses: actions/checkout@v4
        with:
          repository: dirac-institute/kbmod_imdiff_recipe
          path: kbmod_imdiff_recipe
          lfs: false

      - name: Restore LFS cache for kbmod_imdiff_recipe
        id: cache-restore-imdiff
        uses: actions/cache/restore@v4
        with:
          path: kbmod_imdiff_recipe/.git/lfs
          key: ${{ runner.os }}-lfs-imdiff-v2-${{ hashFiles('kbmod_imdiff_recipe/.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-imdiff-v2-

      - name: Pull and verify LFS files for kbmod_imdiff_recipe
        run: bash .github/scripts/lfs_pull_verify.sh kbmod_imdiff_recipe

      # Only reached if the previous step succeeded, so a broken/partial
      # pull can never be cached and poison future runs.
      - name: Save LFS cache for kbmod_imdiff_recipe
        uses: actions/cache/save@v4
        with:
          path: kbmod_imdiff_recipe/.git/lfs
          key: ${{ steps.cache-restore-imdiff.outputs.cache-primary-key }}

      - name: Checkout kbmod_mastercals_recipe
        uses: actions/checkout@v4
        with:
          repository: dirac-institute/kbmod_mastercals_recipe
          path: kbmod_mastercals_recipe
          lfs: false

      - name: Restore LFS cache for kbmod_mastercals_recipe
        id: cache-restore-mastercals
        uses: actions/cache/restore@v4
        with:
          path: kbmod_mastercals_recipe/.git/lfs
          key: ${{ runner.os }}-lfs-mastercals-v2-${{ hashFiles('kbmod_mastercals_recipe/.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-mastercals-v2-

      - name: Pull and verify LFS files for kbmod_mastercals_recipe
        run: bash .github/scripts/lfs_pull_verify.sh kbmod_mastercals_recipe

      - name: Save LFS cache for kbmod_mastercals_recipe
        uses: actions/cache/save@v4
        with:
          path: kbmod_mastercals_recipe/.git/lfs
          key: ${{ steps.cache-restore-mastercals.outputs.cache-primary-key }}

      # Runs on GitHub-hosted ubuntu-latest (genuinely amd64, no emulation
      # needed). Stops at `ingest` - the heavier `night`/`coadd` pipeline
      # stages need more compute than a hosted runner provides and are run
      # separately (see the pipeline-run WIP work) rather than gating PRs.
      - name: Run pipeline
        shell: bash
        run: |
          chmod -R a+rw .
          docker run --rm \
            -v $GITHUB_WORKSPACE:/home/lsst/work \
            -w /home/lsst/work \
            ghcr.io/${{ github.repository }}:lsst-w_2024_34 /bin/bash -c "
              source /opt/lsst/software/stack/loadLSST.bash
              setup lsst_distrib

              set -x

              pip install .

              python tests/make_exposures.py \
                --mastercals-dir kbmod_mastercals_recipe/trimmedRawData/210318/calib \
                --science-dir kbmod_imdiff_recipe/trimmedRawData/210318/science \
                --output ./data/exposures.ecsv \
                --image-dir ./data/images

              # The image already has a fully-initialized butler repo baked
              # in at \$REPO (see Dockerfile: db create, register-instrument,
              # write-curated-calibrations, defects, register-skymap all ran
              # at build time). Reuse it instead of redoing that setup here -
              # it was stopped at the end of the build, so just start it.
              proc-decam db start \$REPO

              proc-decam refcats \$REPO ./data/exposures.ecsv

              cd kbmod_imdiff_recipe/trimmedRawData/fakes
              git checkout stetzler/add-band-to-fakes
              python create_fakes.py
              cd ../../..

              proc-decam fakes \$REPO \
                kbmod_imdiff_recipe/trimmedRawData/fakes/fakes_fakeSrcCat.fits \
                --format fits

              proc-decam ingest ./data/exposures.ecsv -b \$REPO --image-dir ./data/images --select night=20210318 obs_type='zero'
            "
